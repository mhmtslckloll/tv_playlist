name: Update playlist

on:
  schedule:
    - cron: "0 3 * * *"       # her gün 03:00 UTC (Türkiye saatiyle 06:00)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için
  push:
    paths: [channels.txt]     # kanal listesini düzenleyince hemen güncelle

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: Tarayici (dinamik sayfalar icin, olmazsa devam et)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Linkleri kontrol et ve yenile
        run: python official.py --browser

      - name: Playlist'i kaydet
        run: |
          git config user.name "playlist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add turkiye.m3u
          git commit -m "update $(date -u +%Y-%m-%d)" || exit 0
          git push
