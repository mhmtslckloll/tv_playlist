name: Update playlist

on:
  schedule:
    - cron: "*/10 * * * *"    # her 10 dakikada bir (GitHub bazen geciktirir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarayici onbellegi
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Bagimliliklar
        run: pip install requests playwright

      - name: Linkleri kontrol et
        run: python official.py

      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "playlist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kanallar.m3u
          git commit -m "update $(date -u +%Y-%m-%d_%H:%M)" || exit 0
          git push
